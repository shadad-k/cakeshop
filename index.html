<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shadad Cakeshop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>

:root {
    --cream: #fffaf5;
    --white: #ffffff;
    --pink: #f7d8d8;
    --rose: #d96f76;
    --dark: #3a2528;
    --muted: #765f62;
    --gold: #c99b52;
    --border: #eadede;
    --shadow: 0 18px 50px rgba(71,40,43,.10);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "DM Sans", sans-serif;
    background: var(--cream);
    color: var(--dark);
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font: inherit;
    cursor: pointer;
    border: none;
}

.container {
    width: min(1120px, 92%);
    margin: auto;
}

/* ================= HEADER ================= */

header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,250,245,.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}

.nav {
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
}

.logo {
    font-family: "Playfair Display", serif;
    font-size: 27px;
    font-weight: 800;
}

.logo span {
    color: var(--rose);
}

nav {
    display: flex;
    gap: 28px;
    color: var(--muted);
    font-weight: 600;
}

nav a:hover {
    color: var(--rose);
}

.cart-btn {
    background: var(--dark);
    color: white;
    padding: 11px 17px;
    border-radius: 999px;
}

.hamb {
    display: none;
    background: transparent;
    font-size: 25px;
}
